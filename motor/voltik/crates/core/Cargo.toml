[package]
name = "voltik"
description = "CircuiTikZ circuits to SVG and PNG with no TeX install, as a library of tikra."
version = "0.16.0"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matheusmota-dev-br/voltik"
readme = "../../README.md"
keywords = ["circuitikz", "tikz", "circuit", "svg", "latex"]
categories = ["rendering", "graphics", "text-processing"]

include = ["src/**", "Cargo.toml"]

[dependencies]
tikra = { path = "../../../tikra/crates/core" }
