[package]
name = "tikra"
description = "TikZ figures to SVG and PNG with no TeX install; math labels by mathra."
version = "1.8.1"
publish = false
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matheusmota-dev-br/tikra"
readme = "../../README.md"
keywords = ["tikz", "pgfplots", "svg", "png", "latex"]
categories = ["rendering", "graphics", "text-processing"]

include = ["src/**", "Cargo.toml"]

[dependencies]
mathra = { path = "../../../mathra/crates/core", features = ["latin-modern"] }
tikra_calendar = { path = "../calendar" }
tikra_canvas = { path = "../canvas" }
tikra_engine = { path = "../engine" }
tikra_label = { path = "../label" }
tikra_tex = { path = "../tex" }
serde_json = "1"
resvg = { version = "0.45", default-features = false, features = ["raster-images"] }
ttf-parser = "0.25"
