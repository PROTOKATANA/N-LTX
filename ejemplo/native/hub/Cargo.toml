[package]
# cargokit (el plugin de rinf) espera el crate «hub» en native/hub
name = "hub"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
adaptador = { path = "../../../adaptador" }
animacion = { path = "../../../animacion" }
documento = { path = "../../../documento" }
pintor = { path = "../../../pintor" }
primitivas = { path = "../../../primitivas" }
rinf = "=8.10.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true
