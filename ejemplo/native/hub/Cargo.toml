[package]
# cargokit (el plugin de rinf) espera el crate «hub» en native/hub
name = "hub"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
pintor = { path = "../../../pintor" }
visor = { path = "../../../visor" }
mimalloc = { version = "=0.1.52", default-features = false }
rinf = "=8.10.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }

[lints]
workspace = true
